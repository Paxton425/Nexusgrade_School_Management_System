<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | NexusGrade</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-2 overflow-hidden bg-white">
                <div class="card-body p-4 p-sm-5">
                    <img th:src="@{/images/logo.png}" alt="NexusGrade Logo" style="max-height: 200px;"/>

                    <h2 class="fw-bold mb-1" style="color:#214565">Welcome back</h2>
                    <p class="text-muted small mb-4">Please enter your credentials to access your portal dashboard.</p>

                    <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2 py-2.5 rounded-3 mb-4" role="alert" style="font-size: 0.88rem;">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <span>Invalid employee identifier or security credentials.</span>
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center gap-2 py-2.5 rounded-3 mb-4" role="alert" style="font-size: 0.88rem;">
                        <i class="bi bi-check-circle-fill"></i>
                        <span>Session terminated successfully. Secure logging enabled.</span>
                    </div>

                    <form th:action="@{/login}" method="POST">

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small">Select Your Role</label>
                            <div class="row g-2 role-selector">
                                <div class="col-4">
                                    <input type="radio" id="roleAdmin" name="selectedRole" value="ADMIN" checked>
                                    <label for="roleAdmin"><i class="bi bi-shield-lock me-1.5"></i> Admin</label>
                                </div>
                                <div class="col-4">
                                    <input type="radio" id="roleInstructor" name="selectedRole" value="INSTRUCTOR">
                                    <label for="roleInstructor"><i class="bi bi-person-workspace me-1.5"></i> Instructor</label>
                                </div>
                                <div class="col-4">
                                    <input type="radio" id="roleClerk" name="selectedRole" value="CLERK">
                                    <label for="roleClerk"><i class="bi bi-journal-check me-1.5"></i> Clerk</label>
                                </div>
                                <div class="col-4">
                                    <input type="radio" id="roleDeveloper" name="selectedRole" value="DEVELOPER">
                                    <label for="roleDeveloper"><i class="bi bi-code-slash me-1.5"></i> Developer</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="username" name="username" placeholder="Employee ID / Username" required autocomplete="username">
                            <label for="username" class="text-secondary"><i class="bi bi-person me-2"></i>Employee ID or Username</label>
                        </div>

                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required autocomplete="current-password">
                            <label for="password" class="text-secondary"><i class="bi bi-lock me-2"></i>Password</label>
                        </div>

                        <div class="d-flex align-items-center justify-content-between mb-4" style="font-size: 0.85rem;">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me">
                                <label class="form-check-input-label text-muted" for="rememberMe">Remember device session</label>
                            </div>
                            <a href="#" class="text-decoration-none text-muted fw-medium">Recovery Key?</a>
                        </div>

                        <button class="btn btn-teal w-100 py-2.5 rounded-3 fw-semibold mb-2" type="submit">
                            Sign In <i class="bi bi-arrow-right-short ms-1"></i>
                        </button>
                    </form>
                </div>
            </div>
            <p class="text-center text-muted small mt-4">NexusGrade Academic Portal Management Framework &copy; 2026</p>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
