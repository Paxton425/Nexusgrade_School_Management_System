<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{common/layout :: layout(~{::main}, ~{::link}, ~{::scripts})}">
<head>
    <th:block th:fragment="link">
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </th:block>
</head>
<body>

<main class="container mx-auto my-10 p-4 max-w-3xl">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamatation-triangle-fill me-2"></i>
        <span th:text="${error}">Error message here</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="mb-8">
        <a th:href="@{/subjects}" class="text-blue-600 hover:text-blue-800 text-sm font-semibold flex items-center mb-4">
            <i class="fas fa-arrow-left mr-2"></i> Back to Subjects
        </a>
        <h1 class="text-3xl font-bold text-gray-900" th:text="${subject.id == null ? 'Create New Subject' : 'Edit Subject'}">Create New Subject</h1>
        <p class="text-gray-500 mt-1">Define the subject parameters, grading weights, and department.</p>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 shadow-xl overflow-hidden">
        <form th:action="@{/subjects/save}" th:object="${subject}" method="post" class="p-8 space-y-6">
            <input type="hidden" th:field="*{id}" />

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Subject Code</label>
                    <input type="text" th:field="*{subjectCode}" placeholder="e.g. MATH10" required
                           class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition uppercase font-mono" />
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Subject Name</label>
                    <input type="text" th:field="*{name}" placeholder="e.g. Mathematics" required
                           class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Department</label>
                    <select th:field="*{department}" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50">
                        <option th:each="dept : ${departments}" th:value="${dept}" th:text="${dept}"></option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Grade Level</label>
                    <input type="number" th:field="*{grade}" min="8" max="12" required
                           class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none" />
                </div>
            </div>

            <div class="bg-blue-50 p-6 rounded-2xl border border-blue-100">
                <h3 class="text-blue-800 font-bold mb-4 flex items-center text-sm uppercase tracking-wider">
                    <i class="fas fa-balance-scale mr-2"></i> Grading Weights (Decimal)
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-blue-600 mb-1">SBA Weight (e.g. 0.25)</label>
                        <input type="number" step="0.01" th:field="*{sbaWeight}" id="sbaWeight" required
                               class="w-full px-4 py-3 rounded-xl border-blue-200 focus:ring-2 focus:ring-blue-500 outline-none" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-blue-600 mb-1">Exam Weight (e.g. 0.75)</label>
                        <input type="number" step="0.01" th:field="*{examWeight}" id="examWeight" required
                               class="w-full px-4 py-3 rounded-xl border-blue-200 focus:ring-2 focus:ring-blue-500 outline-none" />
                    </div>
                </div>
                <div id="weightWarning" class="mt-4 text-xs font-bold text-red-500 hidden">
                    <i class="fas fa-exclamation-triangle mr-1"></i> Weights must add up to 1.00 (100%)
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" id="submitBtn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg shadow-blue-200 transition-all transform active:scale-95">
                    <i class="fas fa-save mr-2"></i> Save Subject
                </button>
            </div>
        </form>
    </div>
</main>

<th:block th:fragment="scripts">
    <script>
        // Dynamic Validation for Weights
        const sbaInput = document.getElementById('sbaWeight');
        const examInput = document.getElementById('examWeight');
        const warning = document.getElementById('weightWarning');
        const btn = document.getElementById('submitBtn');

        function validateWeights() {
            const total = parseFloat(sbaInput.value || 0) + parseFloat(examInput.value || 0);
            // Precision check for decimals
            if (Math.abs(total - 1.0) > 0.0001 && sbaInput.value && examInput.value) {
                warning.classList.remove('hidden');
                btn.classList.add('opacity-50', 'pointer-events-none');
            } else {
                warning.classList.add('hidden');
                btn.classList.remove('opacity-50', 'pointer-events-none');
            }
        }

        sbaInput.addEventListener('input', validateWeights);
        examInput.addEventListener('input', validateWeights);
    </script>
</th:block>

</body>
</html>
