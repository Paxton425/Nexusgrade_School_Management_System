<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout(~{::content}, ~{::link}, ~{::scripts})}">
<head>
    <Title>Students Achievements Summaries</Title>
    <link rel="stylesheet" th:href="@{/css/students.css}">
</head>
<body>

<div th:fragment="content" class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark">Student Achievement Overview</h3>
            <p class="text-muted">Performance metrics across all subjects</p>
        </div>
        <div>
            <span class="badge bg-primary" th:text="'Total Students: ' + ${studentsSummaries.totalElements}"></span>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Grade Level</th>
                    <th>Average Score</th>
                    <th>Highest achieved</th>
                    <th>Lowest achieved</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="dto : ${studentsSummaries}">
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="avatar-sm me-3 text-white">
                                <span th:text="${#strings.substring(dto.firstName+dto.lastName,0,1)}"></span>
                            </div>
                            <span class="fw-semibold text-dark" th:text="${dto.firstName} + ' ' + ${dto.lastName}">John Doe</span>
                        </div>
                    </td>
                    <td>
                        <span class="badge bg-light text-dark border" th:text="'Grade ' + ${dto.getGrade()}">Grade 10</span>
                    </td>
                    <td>
                        <div class="progress" style="height: 8px; width: 100px;">
                            <div class="progress-bar bg-success" role="progressbar"
                                 th:style="'width: ' + ${dto.average} + '%'"></div>
                        </div>
                        <small class="fw-bold mt-1 d-block" th:text="${#numbers.formatDecimal(dto.average, 1, 1)} + '%'"></small>
                    </td>
                    <td class="text-success fw-bold">
                        <i class="bi bi-caret-up-fill me-1"></i>[[${dto.max}]]%
                    </td>
                    <td class="text-danger fw-bold">
                        <i class="bi bi-caret-down-fill me-1"></i>[[${dto.min}]]%
                    </td>
                    <td class="text-center">
                        <a th:href="@{/result/student-report/{id}(id=${dto.id})}"
                           class="btn btn-light btn-sm btn-action"
                           title="Result Report">
                            <i class="bi bi-person-vcard text-primary fs-3"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination Controls -->
        <div class="card-footer bg-white border-top-0" th:if="${studentsSummaries.totalPages > 1}">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <span class="text-muted small">
                        Showing page <span th:text="${studentsSummaries.number + 1}"></span>
                        of <span th:text="${studentsSummaries.totalPages}"></span>
                        (Total: <span th:text="${studentsSummaries.totalElements}"></span> students)
                    </span>
                </div>
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm mb-0">
                        <!-- First Page -->
                        <li class="page-item" th:classappend="${studentsSummaries.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/grades(page=0, size=${pageSize})}" aria-label="First">
                                <span aria-hidden="true">&laquo;&laquo;</span>
                            </a>
                        </li>

                        <!-- Previous Page -->
                        <li class="page-item" th:classappend="${studentsSummaries.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/grades(page=${studentsSummaries.number - 1}, size=${pageSize})}" aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>

                        <!-- Page Numbers -->
                        <li class="page-item" th:each="pageNumber : ${#numbers.sequence(0, studentsSummaries.totalPages - 1)}"
                            th:classappend="${pageNumber == studentsSummaries.number} ? 'active'">
                            <a class="page-link" th:href="@{/grades(page=${pageNumber}, size=${pageSize})}"
                               th:text="${pageNumber + 1}"></a>
                        </li>

                        <!-- Next Page -->
                        <li class="page-item" th:classappend="${studentsSummaries.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/grades(page=${studentsSummaries.number + 1}, size=${pageSize})}" aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>

                        <!-- Last Page -->
                        <li class="page-item" th:classappend="${studentsSummaries.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/grades(page=${studentsSummaries.totalPages - 1}, size=${pageSize})}" aria-label="Last">
                                <span aria-hidden="true">&raquo;&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>

                <!-- Page Size Selector -->
                <div>
                    <select class="form-select form-select-sm" th:value="${pageSize}"
                            onchange="window.location.href='/grades?page=0&size=' + this.value">
                        <option value="5">5 per page</option>
                        <option value="10">10 per page</option>
                        <option value="20">20 per page</option>
                        <option value="50">50 per page</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
