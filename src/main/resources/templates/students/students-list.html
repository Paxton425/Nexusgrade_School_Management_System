<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{common/layout :: layout(~{::main}, ~{::link}, ~{::scripts})}">
<head>
  <title>Student List | Grading System</title>
  <th:block th:fragment="link">
    <link rel="stylesheet" th:href="@{/css/students.css}">
  </th:block>
</head>
<body class="bg-light">
<th:block th:fragment="main" class="container">
  <!-- Header -->
  <header class="page-header">
    <div>
      <h1>Students</h1>
      <p>Manage enrolled students, track academic status, and view profiles.</p>
    </div>
    <button class="btn btn-primary">+ Add Student</button>
  </header>

  <!-- Toolbar: Search & Filters -->
  <div class="toolbar">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" placeholder="Search by name, ID, or email...">
    </div>

    <div class="filters">
      <select>
        <option value="">All Grade Levels</option>
        <option>Grade 9</option>
        <option>Grade 10</option>
        <option>Grade 11</option>
        <option>Grade 12</option>
      </select>
      <select>
        <option value="">All Statuses</option>
        <option th:each="status : ${T(com.nexusgrade.app.model.Student.Status).values()}"
                th:value="${status}"
                th:text="${status}"></option>
      </select>
    </div>
  </div>

  <!-- Data Table -->
  <div class="table-card">
    <table>
      <thead>
      <tr>
        <th>Student</th>
        <th>Student Code</th>
        <th>Grade / Section</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="student : ${students}">
        <td class="user-cell">
          <div class="avatar"
               th:classappend="${student.color != null ? '' : 'bg-purple'}"
               th:style="|background-color: ${student.color != null? student.getColor().hexValue : ''};|"
               th:text="${#strings.substring(student.firstName, 0, 1) + #strings.substring(student.lastName, 0, 1)}">JD</div>
          <div>
            <div class="name" th:text="${student.firstName + ' ' + student.lastName}">Jane Doe</div>
          </div>
        </td>
        <td class="mono" th:text="${student.studentCode}">STU-2026-089</td>
        <td th:text="|${student.schoolClass != null ? 'Grade '+student.schoolClass.grade+' • Class'+student.schoolClass.title : 'N/A'}|">Grade 10 • Sec A</td>
        <td>
          <span class="badge"
                th:classappend="${student.status == student.status.ACTIVE ? 'badge-active'
                : (student.status.name() == student.status.INACTIVE ? 'badge-inactive'
                : (student.status.name() == student.status.COMPLETED ? 'badge-completed'
                : 'badge-pending'))}"
                th:text="${student.status}">Active</span>
        </td>
        <td><button class="btn-icon">&#8226;&#8226;&#8226;</button></td>
      </tr>
      <tr th:if="${#lists.isEmpty(students)}">
        <td colspan="6" style="text-align: center;">No students found.</td>
      </tr>
      </tbody>
    </table>

    <!-- Pagination -->
    <div class="pagination">
      <span>Showing <span th:text="${students.size()}">0</span> of <span th:text="${totalItems}">0</span> students</span>
      <div class="pagination-buttons">
        <a th:href="@{/students(page=${currentPage - 1})}"
           class="btn-page"
           th:classappend="${currentPage == 0} ? 'disabled'">Previous</a>

        <th:block th:if="${totalPages > 0}" th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
          <a th:href="@{/students(page=${i})}"
             class="btn-page"
             th:classappend="${i == currentPage} ? 'active'"
             th:text="${i + 1}">1</a>
        </th:block>

        <a th:href="@{/students(page=${currentPage + 1})}"
           class="btn-page"
           th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">Next</a>
      </div>
    </div>
  </div>
</th:block>

<th:block th:fragment="scripts">
  <script th:inline="javascript" th:src="@{/scripts/students-list.js}"></script>
</th:block>
</body>
</html>
